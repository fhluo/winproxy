[package]
name = "winproxy-cli"
version = "0.6.2"
edition = "2024"
description = "Change Windows system proxy settings"
categories = ["command-line-utilities"]
keywords = ["windows", "proxy"]
repository = "https://github.com/fhluo/winproxy"
readme = "../README.md"
license = "MIT"

[[bin]]
name = "winproxy"
path = "src/main.rs"

[dependencies]
winproxy = { version = "0.6", path = "../winproxy" }
clap = { version = "4.6", features = ["derive", "string"] }
comfy-table = "7.2"
fluent-templates = "0.15"
sys-locale = "0.3"
icu_locale = "2.2"
