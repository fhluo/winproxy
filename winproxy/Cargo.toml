[package]
name = "winproxy"
version = "0.7.4"
edition = "2024"
rust-version = "1.85"
description = "Change Windows system proxy settings"
categories = ["os::windows-apis"]
keywords = ["windows", "proxy"]
repository = "https://github.com/fhluo/winproxy"
readme = "../README.md"
license = "MIT"
exclude = ["/examples"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []

[dependencies]
bitflags = "2.13"
byteorder = "1.5"
thiserror = "2.0"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.100"
windows-result = "0.100"
